name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, fileinfo, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - run: npm ci
      - run: npm run build
      - run: node --check public/js/hms.js
      - run: php artisan test --compact
      - run: php artisan config:cache
      - run: php artisan route:cache
      - run: php artisan view:cache

  migration-workspace:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/caredesk?replicaSet=caredesk-rs
      CAREDESK_MONGO_REPLICA_URI: mongodb://127.0.0.1:27017/?replicaSet=caredesk-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: backend/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name caredesk-mongodb --publish 27017:27017 mongo:8.2 --replSet caredesk-rs --bind_ip_all
          until docker exec caredesk-mongodb mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done
          docker exec caredesk-mongodb mongosh --quiet --eval 'rs.initiate({_id:"caredesk-rs",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          until docker exec caredesk-mongodb mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) { quit(1) }' >/dev/null 2>&1; do sleep 1; done
      - run: chmod +x backend/gradlew
      - run: ./backend/gradlew -p backend test
      - run: ./backend/gradlew -p backend verifyMongoTransactions
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
