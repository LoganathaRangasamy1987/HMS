name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, fileinfo, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - run: npm ci
      - run: npm run build
      - run: node --check public/js/hms.js
      - run: php artisan test --compact
      - run: php artisan config:cache
      - run: php artisan route:cache
      - run: php artisan view:cache

  migration-workspace:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/caredesk?replicaSet=caredesk-rs
      CAREDESK_MONGO_REPLICA_URI: mongodb://127.0.0.1:27017/?replicaSet=caredesk-rs
    services:
      mongodb:
        image: mongo:8.2
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: backend/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Initialize MongoDB replica set
        run: |
          container_id=$(docker ps --filter ancestor=mongo:8.2 --format '{{.ID}}' | head -n 1)
          docker exec "$container_id" mongosh --quiet --eval 'rs.initiate({_id:"caredesk-rs",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          sleep 5
      - run: chmod +x backend/gradlew
      - run: ./backend/gradlew -p backend test
      - run: ./backend/gradlew -p backend verifyMongoTransactions
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
