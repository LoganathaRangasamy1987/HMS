plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.caredesk'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.xerial:sqlite-jdbc:3.51.1.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('initMongoReplicaSet', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.caredesk.api.migration.MongoReplicaSetInitializer'
}

tasks.register('legacyDataInventory', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.caredesk.api.migration.LegacyDataInventory'
	args = [project.findProperty('legacyDatabase') ?: '../database/database.sqlite']
}

tasks.register('verifyMongoTransactions', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.caredesk.api.migration.MongoTransactionVerifier'
}
